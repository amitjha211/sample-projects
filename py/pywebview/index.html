<!DOCTYPE html>
<html>
<body>
    <h1>Python-JS Bridge</h1>
    <input type="text" id="nameInput" placeholder="Enter your name">
    <button onclick="callPython()">Greet Me</button>
    <button onclick="call_Json()">JSON Test</button>
    <p id="response"></p>

    <script>
        function callPython() {
            const name = document.getElementById('nameInput').value;
            
            // pywebview exposes the Python object under window.pywebview.api
            window.pywebview.api.say_hello(name).then(response => {
                document.getElementById('response').innerText = response;
            });
        }

        function call_Json()
        {
            window.pywebview.api.json_test().then(response => {
                console.log( response);

            });
        }
    </script>
</body>
</html>
